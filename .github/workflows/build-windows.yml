name: Build Native Windows C++ Release (Fizmoh)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native-cpp:
    name: Compile & Sign Native C++ Win32 Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Install NuGet C++ Packages (WebView2 & WIL)
        shell: pwsh
        run: |
          nuget install Microsoft.Web.WebView2 -Version 1.0.2792.45 -OutputDirectory windows_cpp/packages
          nuget install Microsoft.Windows.ImplementationLibrary -Version 1.0.240803.1 -OutputDirectory windows_cpp/packages

      - name: Configure CMake (MSVC x64)
        run: |
          cmake -B windows_cpp/build -S windows_cpp -A x64

      - name: Build Native C++ Release Binary
        run: |
          cmake --build windows_cpp/build --config Release

      - name: Sign Native Executable (Authenticode SHA256)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Fizmoh Cloud Platform LLC, O=Fizmoh Cloud Platform LLC, C=OM" -KeySpec Signature -KeyExportPolicy Exportable -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My"
          $pwd = ConvertTo-SecureString -String "Fizmoh2026Secure!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "windows_cpp\FizmohCert.pfx" -Password $pwd
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          Write-Host "Signing Fizmoh.exe with: $signtool"
          & $signtool sign /f "windows_cpp\FizmohCert.pfx" /p "Fizmoh2026Secure!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "windows_cpp\build\Release\Fizmoh.exe"

      - name: Compile Inno Setup Installer (Fizmoh-Setup.exe)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows_cpp\inno_setup.iss

      - name: Sign Inno Setup Installer (Authenticode SHA256)
        shell: pwsh
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          Write-Host "Signing Fizmoh-Setup.exe with: $signtool"
          & $signtool sign /f "windows_cpp\FizmohCert.pfx" /p "Fizmoh2026Secure!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "windows_cpp\build\installer\Fizmoh-Setup.exe"

      - name: Create Portable Zip Archive (Fizmoh-Windows.zip)
        shell: pwsh
        run: |
          Compress-Archive -Path "windows_cpp\build\Release\*" -DestinationPath "windows_cpp\build\installer\Fizmoh-Windows.zip" -Force

      - name: Upload Installer & Executables to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fizmoh-Windows-x64-Installer
          path: |
            windows_cpp/build/installer/Fizmoh-Setup.exe
            windows_cpp/build/installer/Fizmoh-Windows.zip
            windows_cpp/build/Release/Fizmoh.exe

      - name: Publish to GitHub Releases (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            windows_cpp/build/installer/Fizmoh-Setup.exe
            windows_cpp/build/installer/Fizmoh-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
