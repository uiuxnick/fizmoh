name: Build Windows Release (Fizmoh)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Compile Windows 64-bit Installer (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Locate Flutter Project Directory
        id: set-dir
        shell: bash
        run: |
          if [ -f "flutter_chat/pubspec.yaml" ]; then
            echo "FLUTTER_DIR=flutter_chat" >> $GITHUB_ENV
          elif [ -f "pubspec.yaml" ]; then
            echo "FLUTTER_DIR=." >> $GITHUB_ENV
          else
            echo "FLUTTER_DIR=flutter_chat" >> $GITHUB_ENV
          fi

      - name: Set up Java / Dependencies
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Install Flutter Dependencies
        working-directory: ${{ env.FLUTTER_DIR }}
        run: flutter pub get

      - name: Build Windows Release Binary
        working-directory: ${{ env.FLUTTER_DIR }}
        run: flutter build windows --release

      - name: Compile Inno Setup Installer (Fizmoh-Setup.exe)
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\inno_setup.iss

      - name: Create Portable Zip Archive (Fizmoh-Windows.zip)
        shell: pwsh
        working-directory: ${{ env.FLUTTER_DIR }}
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\installer\Fizmoh-Windows.zip" -Force

      - name: Upload Installer & Executables to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fizmoh-Windows-x64-Installer
          path: |
            ${{ env.FLUTTER_DIR }}/build/windows/installer/Fizmoh-Setup.exe
            ${{ env.FLUTTER_DIR }}/build/windows/installer/Fizmoh-Windows.zip
            ${{ env.FLUTTER_DIR }}/build/windows/x64/runner/Release/Fizmoh.exe

      - name: Publish to GitHub Releases (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.FLUTTER_DIR }}/build/windows/installer/Fizmoh-Setup.exe
            ${{ env.FLUTTER_DIR }}/build/windows/installer/Fizmoh-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
