name: Build Flutter Windows Native App (Fizmoh)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-flutter-windows:
    name: Compile Native Flutter Windows App (.exe)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable Windows Desktop in Flutter
        run: flutter config --enable-windows-desktop

      - name: Install Inno Setup Compiler
        run: choco install innosetup -y --no-progress

      - name: Clean & Install Flutter Dependencies
        working-directory: ./flutter_chat
        run: |
          flutter clean
          flutter pub get

      - name: Build Flutter Windows Release Binary
        working-directory: ./flutter_chat
        run: |
          flutter build windows --release --verbose

      - name: Sign Flutter Executable (Authenticode SHA256)
        shell: pwsh
        working-directory: ./flutter_chat
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=Fizmoh Cloud Platform LLC, O=Fizmoh Cloud Platform LLC, C=OM" -KeySpec Signature -KeyExportPolicy Exportable -KeyLength 2048 -HashAlgorithm SHA256 -CertStoreLocation "Cert:\CurrentUser\My"
          $pwd = ConvertTo-SecureString -String "Fizmoh2026Secure!" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "FizmohCert.pfx" -Password $pwd
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          Write-Host "Signing Flutter binary with: $signtool"
          & $signtool sign /f "FizmohCert.pfx" /p "Fizmoh2026Secure!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "build\windows\x64\runner\Release\flutter_chat.exe"

      - name: Compile Inno Setup Installer (Fizmoh-Setup.exe)
        working-directory: ./flutter_chat
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\inno_setup.iss

      - name: Sign Inno Setup Installer (Authenticode SHA256)
        shell: pwsh
        working-directory: ./flutter_chat
        run: |
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Filter "signtool.exe" -Recurse | Where-Object { $_.FullName -like "*x64*" } | Select-Object -First 1).FullName
          & $signtool sign /f "FizmohCert.pfx" /p "Fizmoh2026Secure!" /fd SHA256 /tr "http://timestamp.digicert.com" /td SHA256 "build\windows\installer\Fizmoh-Setup.exe"

      - name: Create Portable Zip Archive (Fizmoh-Windows.zip)
        shell: pwsh
        working-directory: ./flutter_chat
        run: |
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "build\windows\installer\Fizmoh-Windows.zip" -Force

      - name: Upload Installer & Executables to Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Fizmoh-Windows-Flutter-Installer
          path: |
            flutter_chat/build/windows/installer/Fizmoh-Setup.exe
            flutter_chat/build/windows/installer/Fizmoh-Windows.zip

      - name: Publish to GitHub Releases (Tags Only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            flutter_chat/build/windows/installer/Fizmoh-Setup.exe
            flutter_chat/build/windows/installer/Fizmoh-Windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
