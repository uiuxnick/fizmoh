  <text x="84" y="280" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">1. Instant Slot Booking</text>
  <rect x="84" y="305" width="282" height="44" rx="8" fill="#0F172A" stroke="#334155"/>
