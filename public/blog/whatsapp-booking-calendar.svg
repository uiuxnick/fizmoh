  </defs>
  <rect width="1200" height="630" fill="url(#gridBk)" opacity="0.8"/>
  <circle cx="250" cy="180" r="180" fill="#00E785" fill-opacity="0.1" filter="blur(80px)"/>
  <circle cx="950" cy="450" r="180" fill="#00E785" fill-opacity="0.12" filter="blur(90px)"/>

  <!-- Brand Badges -->
  <rect x="60" y="50" width="180" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
