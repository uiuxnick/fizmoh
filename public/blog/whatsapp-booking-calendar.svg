  <text x="850" y="388" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🗺️ 2-Hour Clinic / Tour GPS Pin</text>
  <rect x="834" y="415" width="282" height="44" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="850" y="443" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🔄 1-Tap In-Chat Reschedule</text>
