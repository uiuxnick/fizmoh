  <text x="490" y="398" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚡ Visual Botflow Studio</text>
  
  <rect x="474" y="420" width="272" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="490" y="443" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">💳 AmwalPay OMR Gateway</text>
  
  <rect x="474" y="465" width="272" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="490" y="488" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">🤖 Gulf Arabic Dialect AI</text>
  
  <rect x="474" y="510" width="272" height="36" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="490" y="533" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">📦 WooCommerce Two-Way Sync</text>
  
  <!-- Connector 2 -->
  <path d="M 770 400 L 860 400" stroke="#00E785" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="865,400 855,394 855,406" fill="#00E785"/>
  
  <!-- Node 3: Commercial Endpoints -->
  <rect x="870" y="240" width="270" height="320" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>
  <text x="894" y="280" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="800">Omnichannel Delivery</text>
  
  <rect x="894" y="300" width="222" height="50" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="910" y="324" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Team Staff Inboxes</text>
  <text x="910" y="340" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Unlimited agent logins</text>
  
