  <text x="910" y="384" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Broadcast Campaigns</text>
  <text x="910" y="400" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">98% open rates with templates</text>
  
  <rect x="894" y="420" width="222" height="50" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="910" y="444" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Direct Payment Link</text>
  <text x="910" y="460" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Instant bank settlements</text>
  
  <rect x="894" y="480" width="222" height="50" rx="10" fill="#0F172A" stroke="#334155"/>
  <text x="910" y="504" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">Enterprise Audits</text>
  <text x="910" y="520" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Full ISO 27001 data isolation</text>
</svg>
