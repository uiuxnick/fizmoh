<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#0B0F17"/>
  
  <!-- Subtle Grid Pattern -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="brandGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00E785"/>
      <stop offset="100%" stop-color="#00B96A"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#grid)" opacity="0.8"/>
  
  <!-- Glowing Ambient Circles -->
  <circle cx="200" cy="150" r="180" fill="#00E785" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="480" r="220" fill="#00E785" fill-opacity="0.08" filter="blur(100px)"/>
  
  <!-- Brand Badge Top Left -->
  <rect x="60" y="50" width="180" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="82" cy="71" r="10" fill="#00E785"/>
  <text x="102" y="77" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="1">FIZMOH CLOUD</text>
  
  <!-- Verification Badge -->
  <rect x="255" y="50" width="220" height="42" rx="21" fill="#00E785" fill-opacity="0.15" stroke="#00E785" stroke-width="1.5"/>
  <text x="275" y="76" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Official Meta Cloud API</text>
  
  <!-- Main Title Area -->
  <text x="60" y="145" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">WhatsApp Business API &amp; Cloud Platform</text>
  <text x="60" y="185" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Multi-Agent Team CRM · Official Green Tick · GCC Infrastructure (Oman · UAE · KSA)</text>
  
  <!-- Architecture Diagram Area -->
  
  <!-- Node 1: Meta WhatsApp Cloud -->
  <rect x="60" y="240" width="280" height="320" rx="16" fill="url(#cardBg)" stroke="#334155" stroke-width="2"/>
  <rect x="84" y="264" width="48" height="48" rx="12" fill="#00E785" fill-opacity="0.2" stroke="#00E785" stroke-width="1.5"/>
  <!-- WhatsApp Icon SVG in box -->
  <path d="M108 280c-4.4 0-8 3.6-8 8 0 1.5.4 3 1.2 4.2L100 298l6-1.6c1.2.7 2.6 1.1 4 1.1 4.4 0 8-3.6 8-8s-3.6-8-8-8z" fill="#00E785"/>
  <text x="84" y="342" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="800">Meta Cloud API</text>
  <text x="84" y="370" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Official Graph Webhooks</text>
  <text x="84" y="394" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">24-Hour SLA Windows</text>
  <text x="84" y="418" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="500">Tier-3 High Volume</text>
  <rect x="84" y="470" width="232" height="60" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="100" y="496" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ Green Tick Verified</text>
  <text x="100" y="516" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="12">99.99% Uptime Guarantee</text>
  
  <!-- Connector 1 -->
  <path d="M 340 400 L 440 400" stroke="#00E785" stroke-width="3" stroke-dasharray="6 6"/>
  <polygon points="445,400 435,394 435,406" fill="#00E785"/>
  
  <!-- Node 2: Fizmoh Multi-Tenant Core Engine -->
  <rect x="450" y="220" width="320" height="350" rx="18" fill="#0F172A" stroke="#00E785" stroke-width="2.5"/>
  <rect x="474" y="244" width="52" height="52" rx="12" fill="#00E785"/>
  <text x="490" y="278" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="900">F</text>
  <text x="474" y="326" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">Fizmoh Engine</text>
  <text x="474" y="352" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Multi-Agent CRM Core</text>
  
