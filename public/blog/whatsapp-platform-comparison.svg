<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" rx="24" fill="#0B0F17"/>
  <defs>
    <pattern id="gridCmp" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="1" stroke-opacity="0.6"/>
    </pattern>
    <linearGradient id="cardBgCmp" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#gridCmp)" opacity="0.8"/>
  <circle cx="200" cy="180" r="180" fill="#00E785" fill-opacity="0.12" filter="blur(80px)"/>
  <circle cx="1000" cy="450" r="180" fill="#00E785" fill-opacity="0.1" filter="blur(90px)"/>

  <!-- Brand Badges -->
  <rect x="60" y="50" width="180" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.5"/>
  <circle cx="82" cy="71" r="10" fill="#00E785"/>
  <text x="102" y="77" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="800" letter-spacing="1">FIZMOH CLOUD</text>

  <rect x="255" y="50" width="260" height="42" rx="21" fill="#00E785" fill-opacity="0.15" stroke="#00E785" stroke-width="1.5"/>
  <text x="275" y="76" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700">Enterprise Platform Matrix</text>

  <!-- Title -->
  <text x="60" y="145" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="900" letter-spacing="-0.5">WhatsApp Business API vs Alternatives</text>
  <text x="60" y="185" fill="#94A3B8" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="500">Fizmoh vs WATI vs Twilio vs Interakt · GCC Regional Feature &amp; Pricing Benchmark</text>

  <!-- Winner Column: Fizmoh -->
  <rect x="60" y="230" width="400" height="340" rx="18" fill="#0F172A" stroke="#00E785" stroke-width="2.5"/>
  <rect x="84" y="254" width="44" height="44" rx="10" fill="#00E785"/>
  <text x="96" y="286" fill="#000000" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">★</text>
  <text x="140" y="284" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900">Fizmoh Cloud (GCC)</text>
  
  <rect x="84" y="315" width="352" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="100" y="340" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ Native AmwalPay OMR Gateway (Direct Bank Payouts)</text>
  
  <rect x="84" y="365" width="352" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="100" y="390" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ Gulf Arabic Colloquial AI Dialect Engine</text>
  
  <rect x="84" y="415" width="352" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="100" y="440" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ Built-in Tours, Clinic Beds, POS &amp; Woo Sync</text>

  <rect x="84" y="465" width="352" height="40" rx="8" fill="#1E293B" stroke="#334155"/>
  <text x="100" y="490" fill="#00E785" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700">✓ Zero Markup on Official Meta Conversation Fees</text>

  <!-- Competitor Comparison Columns -->
  <rect x="490" y="240" width="310" height="320" rx="16" fill="url(#cardBgCmp)" stroke="#334155" stroke-width="2"/>
  <text x="514" y="280" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">WATI / Interakt</text>
  <rect x="514" y="305" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="530" y="330" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✗ Razorpay / Stripe only (No OMR)</text>
  <rect x="514" y="355" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="530" y="380" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✗ Generic English / Hindi Focus</text>
  <rect x="514" y="405" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="530" y="430" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚠ Generic E-commerce only</text>
  <rect x="514" y="455" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="530" y="480" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✗ High Per-Message Markups</text>

  <rect x="830" y="240" width="310" height="320" rx="16" fill="url(#cardBgCmp)" stroke="#334155" stroke-width="2"/>
  <text x="854" y="280" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="19" font-weight="800">Twilio API</text>
  <rect x="854" y="305" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="870" y="330" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✗ No UI / Inboxes (Raw API)</text>
  <rect x="854" y="355" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="870" y="380" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✗ Requires Months of Coding</text>
  <rect x="854" y="405" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="870" y="430" fill="#EF4444" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">✗ No Turnkey Vertical Modules</text>
  <rect x="854" y="455" width="262" height="40" rx="8" fill="#0F172A" stroke="#334155"/>
  <text x="870" y="480" fill="#E2E8F0" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600">⚠ Pay-Per-API Call Pricing</text>
</svg>
