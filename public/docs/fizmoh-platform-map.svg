<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Fizmoh platform architecture</title>
  <desc id="desc">WhatsApp connects to Fizmoh automation and then to CRM, bookings, payments, hospital, restaurant and commerce modules.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1"><stop stop-color="#ecfdf5"/><stop offset="1" stop-color="#f0fdfa"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity=".12"/></filter></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="60" y="66" fill="#064e3b" font-family="Arial,sans-serif" font-size="28" font-weight="700">Fizmoh operational loop</text>
  <text x="60" y="96" fill="#47756b" font-family="Arial,sans-serif" font-size="16">One WhatsApp conversation can trigger every business action.</text>
  <g stroke="#10b981" stroke-width="4" fill="none" stroke-linecap="round"><path d="M300 292H405"/><path d="M665 292H790"/><path d="M925 245V165"/><path d="M925 340V420"/><path d="M790 292H710V510H580"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" filter="url(#shadow)">
    <rect x="70" y="220" width="230" height="145" rx="24" fill="#075e54"/><text x="185" y="275" fill="#fff" font-size="22" font-weight="700">WhatsApp</text><text x="185" y="305" fill="#b7f7dc" font-size="15">Messages · buttons · lists</text><text x="185" y="330" fill="#b7f7dc" font-size="15">Inbound and outbound</text>
    <rect x="405" y="190" width="260" height="205" rx="24" fill="#111827"/><text x="535" y="246" fill="#fff" font-size="22" font-weight="700">Fizmoh Core</text><text x="535" y="278" fill="#a7f3d0" font-size="15">Bot Builder + AI</text><text x="535" y="305" fill="#a7f3d0" font-size="15">Tenant-safe data</text><text x="535" y="332" fill="#a7f3d0" font-size="15">Flow runs + webhooks</text><text x="535" y="359" fill="#a7f3d0" font-size="15">Human handoff</text>
    <rect x="790" y="90" width="270" height="100" rx="20" fill="#fff"/><text x="925" y="132" fill="#14532d" font-size="19" font-weight="700">CRM &amp; Inbox</text><text x="925" y="160" fill="#52756b" font-size="14">Contacts · notes · staff</text>
    <rect x="790" y="235" width="270" height="100" rx="20" fill="#fff"/><text x="925" y="277" fill="#14532d" font-size="19" font-weight="700">Bookings &amp; Payments</text><text x="925" y="305" fill="#52756b" font-size="14">Tours · appointments · AmwalPay</text>
    <rect x="790" y="420" width="270" height="100" rx="20" fill="#fff"/><text x="925" y="462" fill="#14532d" font-size="19" font-weight="700">Business Modules</text><text x="925" y="490" fill="#52756b" font-size="14">Hospital · Restaurant · WooCommerce</text>
    <rect x="345" y="470" width="235" height="80" rx="18" fill="#d1fae5"/><text x="462" y="504" fill="#065f46" font-size="18" font-weight="700">Reports &amp; Audit</text><text x="462" y="528" fill="#47756b" font-size="13">Usage · logs · exports</text>
  </g>
  <g fill="#10b981"><circle cx="300" cy="292" r="7"/><circle cx="405" cy="292" r="7"/><circle cx="665" cy="292" r="7"/><circle cx="790" cy="292" r="7"/><circle cx="925" cy="245" r="7"/><circle cx="925" cy="340" r="7"/><circle cx="710" cy="510" r="7"/><circle cx="580" cy="510" r="7"/></g>
</svg>
